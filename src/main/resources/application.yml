spring:
  profiles:
    default: local
  application:
    name: scentra-api
  sql:
    init:
      mode: never
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
  jwt:
    secret: ${JWT_SECRET}
  cloud:
    aws:
      stack:
        auto: false
      s3:
        bucket: ${S3_BUCKET_NAME:test-bucket}
      region:
        static: ${S3_REGION:us-east-1}
      credentials:
        accessKey: ${S3_ACCESS_KEY:dummy-access-key}
        secretKey: ${S3_SECRET_KEY:dummy-secret-key}
  cors:
    allowed-origins: ${FRONTEND_HOST:http://localhost:5173/}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:
  jwt:
    secret: this-is-a-long-dummy-jwt-secret-for-testing-only
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        globally_quoted_identifiers: true