name: 개발 환경 배포

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy: # build 라는 이름의 job
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE }}

    steps:
      # 1. Repository Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      # 4. Build with Gradle
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 7. Push image to Docker Hub
      - name: Push Docker image
        run: docker push $IMAGE_NAME

      # 8. Save SSH key
      - name: Save EC2 key
        run: |
          echo "${{ secrets.EC2_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      # 9. SSH to EC@ and deploy container
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF
          sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
          sudo docker pull $IMAGE_NAME
          sudo docker stop scentra || true
          sudo docker rm scentra || true
          sudo docker run -d --name scentra \
            -e DB_URL=${{ secrets.DB_URL }} \
            -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e S3_BUKET_NAME=${{ secrets.S3_BUKET_NAME }} \
            -e S3_REGION=${{ secrets.S3_REGION }} \
            -e S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }} \
            -e S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }} \
            -p 8080:8080 $IMAGE_NAME
          EOF

    permissions: write-all