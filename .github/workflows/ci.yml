name: Scentra_CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository Checkout
      - name: Checkout
        uses: actions/checkout@v2

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      # 4. Build with Gradle
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      # 5. Docker Build
      - name: Build Docker Image
        run: |
          docker build -t scentra-api .

      # 6. Docker Run
      - name: Run Docker Container
        run: |
          docker run -d -p 8080:8080 --name springboot-container scentra-api

      # 7. Test Docker Container (Optional)
      - name: Test Docker Container
        run: |
          sleep 10 # 10초 대기 후 curl 테스트
          docker exec springboot-container curl --fail http://localhost:8080 || exit 1

      # 8. Clean Up
      - name: Clean Up Docker Container
        if: always()
        run: |
          docker stop springboot-container
          docker rm springboot-container

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
